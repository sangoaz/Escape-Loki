<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Loki Escape Game</title>
    <style>
        body {
            font-family: Arial;
            background: #1e1e1e;
            color: white;
            display: flex;
            justify-content: center;
        }

        #chat {
            width: 400px;
            height: 600px;
            background: #2a2a2a;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
        }

        .msg {
            margin: 5px;
            padding: 8px;
            border-radius: 8px;
            max-width: 80%;
        }

        .milo { background: #4caf50; align-self: flex-start; }
        .loki { background: #e91e63; align-self: flex-start; }
        .alex { background: #2196f3; align-self: flex-end; }

        #input-area {
            display: flex;
            margin-top: 10px;
        }

        input {
            flex: 1;
            padding: 8px;
        }

        button {
            padding: 8px;
        }
    </style>
</head>
<body>

<div id="chat">
    <div id="messages"></div>

    <div id="input-area">
        <input type="text" id="input" placeholder="Tape ta réponse..." />
        <button onclick="send()">Envoyer</button>
    </div>
</div>

<script>
let playerId = null;
let renderedCount = 0;

async function startGame() {
    const res = await fetch("/game/start", { method: "POST" });
    const data = await res.json();

    playerId = data.player_id;

    await renderNewMessages(data.messages);
}

async function send() {
    const input = document.getElementById("input");
    const value = input.value.trim();

    if (!value) return;

    input.value = "";

    await fetch("/game/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            player_id: playerId,
            answer: value
        })
    });

    await refreshMessages();
}

async function refreshMessages() {
    const res = await fetch(`/game/messages/${playerId}`);
    const data = await res.json();

    await renderNewMessages(data.messages);
}

async function renderNewMessages(messages) {
    const newMessages = messages.slice(renderedCount);

    for (const msg of newMessages) {
        if (msg.sender === "alex") {
            appendMessage(msg);
        } else {
            await showTypingThenMessage(msg);
        }

        renderedCount++;
    }
}

function appendMessage(msg) {
    const container = document.getElementById("messages");

    const div = document.createElement("div");
    div.className = `msg ${msg.sender}`;
    div.innerText = `${msg.sender.toUpperCase()} : ${msg.content}`;

    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

async function showTypingThenMessage(msg) {
    const container = document.getElementById("messages");

    const typingDiv = document.createElement("div");
    typingDiv.className = `msg ${msg.sender} typing`;
    typingDiv.innerText = `${msg.sender.toUpperCase()} : ...`;

    container.appendChild(typingDiv);
    container.scrollTop = container.scrollHeight;

    const delay = getTypingDelay(msg.content);
    await sleep(delay);

    typingDiv.className = `msg ${msg.sender}`;
    typingDiv.innerText = `${msg.sender.toUpperCase()} : ${msg.content}`;
    container.scrollTop = container.scrollHeight;
}

function getTypingDelay(content) {
    const length = content.length;

    if (length < 40) return 800;
    if (length < 100) return 1400;
    return 2200;
}

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

startGame();
</script>

</body>
</html>
